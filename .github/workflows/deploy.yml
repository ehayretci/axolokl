# Deploys axolokl.co.uk (Cloudflare Worker "axolokl-site", in Seb's Cloudflare account) on every push to master.
# Needs the repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token, made by Seb).
name: Deploy to Cloudflare
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the API token secret is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bec7cd735b2d571b2ba815007fff0faf
