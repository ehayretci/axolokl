# Deploys axolokl.co.uk (Cloudflare Worker "axolokl-site", in Seb's Cloudflare account) on every push to master.
# Needs the repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token, made by Seb).
name: Deploy to Cloudflare
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bec7cd735b2d571b2ba815007fff0faf
          command: deploy
